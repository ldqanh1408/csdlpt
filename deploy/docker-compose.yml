# D1 Skeleton compose — chỉ stub /health pass.
# D2 sẽ bổ sung prometheus, grafana và full env theo §8.13.

services:
  coordinator:
    build:
      context: ..
      dockerfile: deploy/coordinator/Dockerfile
    image: csdlpt/coordinator:d1
    container_name: csdlpt-coordinator
    environment:
      TOTAL_NODES: 4
      ALLOWED_LATENESS_S: "2.0"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s

  node0: &node-base
    build:
      context: ..
      dockerfile: deploy/node/Dockerfile
    image: csdlpt/node:d1
    container_name: csdlpt-node0
    environment:
      NODE_ID: "0"
      COORDINATOR_URL: http://coordinator:8000
    volumes:
      - ../dlq/node0:/var/lib/csdlpt/dlq
    ports:
      - "8101:8000"
    cap_add:
      - NET_ADMIN
    depends_on:
      coordinator:
        condition: service_healthy

  node1:
    <<: *node-base
    container_name: csdlpt-node1
    environment:
      NODE_ID: "1"
      COORDINATOR_URL: http://coordinator:8000
    volumes:
      - ../dlq/node1:/var/lib/csdlpt/dlq
    ports:
      - "8102:8000"

  node2:
    <<: *node-base
    container_name: csdlpt-node2
    environment:
      NODE_ID: "2"
      COORDINATOR_URL: http://coordinator:8000
    volumes:
      - ../dlq/node2:/var/lib/csdlpt/dlq
    ports:
      - "8103:8000"

  node3:
    <<: *node-base
    container_name: csdlpt-node3
    environment:
      NODE_ID: "3"
      COORDINATOR_URL: http://coordinator:8000
    volumes:
      - ../dlq/node3:/var/lib/csdlpt/dlq
    ports:
      - "8104:8000"

  ingestor:
    build:
      context: ..
      dockerfile: deploy/ingestor/Dockerfile
    image: csdlpt/ingestor:d1
    container_name: csdlpt-ingestor
    environment:
      NODE_HOSTS: "node0:8000,node1:8000,node2:8000,node3:8000"
      COORDINATOR_URL: http://coordinator:8000
    volumes:
      - ../dataset:/data:ro
    profiles: ["manual"]
    depends_on:
      - node0
      - node1
      - node2
      - node3

  prometheus:
    image: prom/prometheus:latest
    container_name: csdlpt-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - coordinator

  grafana:
    image: grafana/grafana:latest
    container_name: csdlpt-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
