global:
  scrape_interval: 2s
  evaluation_interval: 5s

scrape_configs:
  - job_name: nodes
    static_configs:
      - targets:
          - node0:8000
          - node1:8000
          - node2:8000
          - node3:8000
    metrics_path: /metrics

  - job_name: coordinator
    static_configs:
      - targets: [coordinator:8000]
    metrics_path: /metrics
