# Prometheus scrape configuration for CSDLPT stream processor.
# Targets the refactor app on port 8000.
#
# Usage:
#   prometheus --config.file=deploy/prometheus.yml

global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 10s

# alerting disabled — no alertmanager service in compose
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - "alertmanager:9093"

rule_files:
  - "prometheus-rules.yml"

scrape_configs:
  - job_name: "csdlpt-coordinator"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "coordinator-1:8000"
          - "coordinator-2:8000"
          - "coordinator-3:8000"
        labels:
          role: "coordinator"

  - job_name: "csdlpt-aggregator"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "aggregator:8000"
          - "aggregator-standby:8000"
        labels:
          role: "aggregator"

  - job_name: "csdlpt-workers"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "node0:8000"
          - "node1:8000"
          - "node2:8000"
          - "node3:8000"
        labels:
          role: "worker"

  - job_name: "csdlpt-ingestor"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "ingestor:8000"
        labels:
          role: "ingestor"
